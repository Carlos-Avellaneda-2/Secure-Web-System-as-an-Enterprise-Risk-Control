# /etc/httpd/conf.d/enterprise-risk.conf  (Amazon Linux / httpd)
# certbot --apache copies this virtual host into enterprise-risk-le-ssl.conf
# for port 443 and adds an HTTP -> HTTPS redirect here.
<VirtualHost *:80>
    ServerName team4-risk.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8081/api/
    ProxyPassReverse /api/ http://127.0.0.1:8081/api/
    # "http" on port 80, "https" in the SSL copy created by certbot.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ErrorLog /var/log/httpd/enterprise-risk-error.log
    CustomLog /var/log/httpd/enterprise-risk-access.log combined
</VirtualHost>
