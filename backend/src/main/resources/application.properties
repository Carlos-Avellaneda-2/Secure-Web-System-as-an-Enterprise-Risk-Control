spring.application.name=enterprise-risk-api

# Auth0 resource-server settings, read from environment variables.
# The issuer must include https:// and the trailing slash.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-onzcado3s7e0rlv3.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://enterprise-risk-api}

# Exact browser origins allowed by CORS (comma separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://team4-risk.duckdns.org}

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=native

# Only the health endpoint is exposed, without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
